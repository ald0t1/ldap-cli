# ldap-cli configuration.
#
# Searched, in order, when --config is not given:
#   $LDAP_CLI_CONFIG
#   ./ldap-cli.yaml, ./ldap-cli.yml
#   $XDG_CONFIG_HOME/ldap-cli/config.yaml
#   ~/.config/ldap-cli/config.yaml
#
# The manager bind password is never stored here. It comes from
# $LDAP_CLI_BIND_PASSWORD, --bind-password-file, or an interactive prompt.

default_profile: dev

# Where pre-write snapshots go, one subdirectory per profile. Overridden by
# --backup-dir or $LDAP_CLI_BACKUP_DIR; defaults to
# $XDG_STATE_HOME/ldap-cli/backups when unset.
#
# These artifacts contain password hashes. They are written 0600 in a 0700
# directory; keep them somewhere you would keep a directory dump.
# backup_dir: /var/backups/ldap-cli

# How many snapshots to retain per profile. Older ones are deleted after each
# new snapshot is written.
backup_keep: 10

# New-account notification mail. Off unless enabled is true.
#
# This configuration points at the MailHog container from compose.yaml, which
# captures everything and delivers nothing — inspect it at localhost:8025.
mail:
  enabled: true
  host: mailhog
  port: 1025
  from: Directory Provisioning <noreply@example.org>

  # none | starttls | tls. MailHog offers neither auth nor TLS, so none.
  # A real relay is almost always starttls on 587 or tls on 465.
  encryption: none

  # SMTP auth is opt-in: leave username unset and no AUTH is attempted, which
  # is what this dev profile does and what a relay that allowlists sender IPs
  # usually wants. A password is only needed if you set a username.
  #
  # Setting a username requires encryption to be starttls or tls, so
  # credentials are never sent in the clear.
  #
  # The password can live here directly — if so, chmod 0600 this file and keep
  # it out of version control, since nothing else in it is secret:
  # username: ldap-cli@corp.com
  # password: the-smtp-password
  #
  # Or name an environment variable to read it from instead, which keeps the
  # secret out of the file entirely. This wins if both are set:
  # password_env: LDAP_CLI_SMTP_PASSWORD

  # RFC 2156 Sensitivity header: personal, private or company-confidential.
  # Leave empty to omit it. Clients that honour it will mark the message and
  # may block forwarding — worth setting when the mail carries a password.
  sensitivity: company-confidential

  # Whether the generated password appears in the message. Turning this off
  # sends the account details only, and the password has to be delivered some
  # other way.
  include_password: true

  # Subject and body are text/template over the account. Available fields:
  # .Username .FullName .Email .DN .Profile .Password
  subject: "Your new account: {{.Username}}"
  # body: |
  #   Hello {{.FullName}}, your username is {{.Username}}.

  # Extra headers, each "Name: value".
  # headers:
  #   - "X-Auto-Response-Suppress: All"

  # bcc:
  #   - it-audit@example.org

  timeout: 10s

profiles:
  # A production server: TLS on the wire, verified against a private CA.
  prod:
    url: ldaps://ldap.corp.com:636
    ca_cert: /etc/ssl/corp-ca.pem
    insecure_skip_verify: false
    # Leave false so the tool refuses to send the bind password in the clear.
    allow_insecure_bind: false

    bind_dn: cn=manager,dc=corp,dc=com
    user_base_dn: ou=people,dc=corp,dc=com
    group_base_dn: ou=groups,dc=corp,dc=com

    user_rdn_attr: uid
    default_primary_group: users
    login_shell: /bin/bash
    home_template: /home/{{.Username}}
    # Used to default --email to <username>@<mail_domain>.
    mail_domain: corp.com
    extra_user_object_classes: []
    username_max_length: 32
    password_length: 16

    uid:
      min: 10000
      max: 60000
      # Optional. When set, this entry holds the next-id counter and is claimed
      # atomically. The directory is scanned either way and the scan acts as a
      # floor, so a stale counter can never reissue a live id.
      next_dn: cn=uidNext,ou=system,dc=corp,dc=com
      next_attr: uidNumber
    gid:
      min: 20000
      max: 60000
      next_dn: cn=gidNext,ou=system,dc=corp,dc=com
      next_attr: gidNumber

  # The throwaway server from compose.yaml. The host is the compose service
  # name, because the CLI runs in a sibling container. No counter entries here,
  # so ids come purely from scanning the directory.
  dev:
    url: ldap://ldap:1389
    start_tls: false
    allow_insecure_bind: true

    bind_dn: cn=admin,dc=example,dc=org
    user_base_dn: ou=people,dc=example,dc=org
    group_base_dn: ou=groups,dc=example,dc=org

    default_primary_group: users
    mail_domain: example.org
    uid:
      min: 10000
      max: 60000
    gid:
      min: 20000
      max: 60000
